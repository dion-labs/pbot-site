<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f1eb" />
    <meta
      name="description"
      content="Meet pbot: an experimental, open-source workbench for local Android automation in Pokémon TCG Pocket. Built by DionLabs."
    />
    <title>pbot — A little bot. A persistent player.</title>
    <link rel="icon" href="/favicon.png" />
    <link rel="canonical" href="https://pbot.dionlabs.ai/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="pbot" />
    <meta property="og:url" content="https://pbot.dionlabs.ai/" />
    <meta property="og:title" content="pbot — A little bot. A persistent player." />
    <meta property="og:description" content="Experimental local automation for Pokémon TCG Pocket Step-Up Battles. Free and open source. macOS + Android over USB." />
    <meta property="og:image" content="https://pbot.dionlabs.ai/pbot-social-preview.png" />
    <meta property="og:image:alt" content="pbot's ivory robot mascot on charcoal, beside the words: A little bot. A persistent player. Local Android automation." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="pbot — A little bot. A persistent player." />
    <meta name="twitter:description" content="Experimental local automation for Pokémon TCG Pocket Step-Up Battles. Free and open source. macOS + Android over USB." />
    <meta name="twitter:image" content="https://pbot.dionlabs.ai/pbot-social-preview.png" />
    <meta name="twitter:image:alt" content="pbot's ivory robot mascot on charcoal, beside the words: A little bot. A persistent player. Local Android automation." />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('pbot-theme') === 'light' ? 'light' : 'dark';
      } catch {}
      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute(
          'content',
          document.documentElement.dataset.theme === 'dark'
            ? '#141b20'
            : '#f3f1eb',
        );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
